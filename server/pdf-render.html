<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #fbf7ee; overflow: hidden; }
  canvas { display: block; width: 1200px; height: 1200px; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="1200"></canvas>
<script type="module">
import * as pdfjs from '/pdfjs/pdf.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = '/pdfjs/pdf.worker.mjs';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#fbf7ee';
ctx.fillRect(0, 0, 1200, 1200);

const file = new URLSearchParams(location.search).get('file') || '';
const pageNo = Math.max(1, Number(new URLSearchParams(location.search).get('page') || 1) || 1);
try {
  const doc = await pdfjs.getDocument(file).promise;
  window.__pdfPages = doc.numPages;
  const page = await doc.getPage(Math.min(pageNo, doc.numPages));
  const base = page.getViewport({ scale: 1 });
  const scale = Math.min(1100 / base.width, 1100 / base.height);
  const viewport = page.getViewport({ scale });
  const x = (1200 - viewport.width) / 2;
  const y = (1200 - viewport.height) / 2;
  ctx.save();
  ctx.translate(x, y);
  await page.render({ canvasContext: ctx, viewport }).promise;
  ctx.restore();
  window.__pdfDone = true;
} catch (e) {
  window.__pdfError = String((e && e.message) || e);
  ctx.fillStyle = '#2B2117';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText('PDF 页面渲染失败', 80, 120);
  ctx.font = '18px sans-serif';
  ctx.fillText(window.__pdfError.slice(0, 70), 80, 160);
}
</script>
</body>
</html>
